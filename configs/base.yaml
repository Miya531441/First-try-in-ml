# Spec v2 baseline: squads spawn in opposite corners; mostly 3v3 with some smaller squads;
# shared recurrent policy with an entity-token encoder, full team blackboard, role
# conditioning with a diversity bonus and role-specific / team-work incentives.
seed: 0

env:
  arena_size: 58.79                  # area 3456 m2, 1.5x the original 48 m arena
  dt: 0.05
  max_steps: 1500                    # 75 s: the 83 m diagonal takes ~21 s to cross
  team_size: 3                       # slots per team
  team_sizes: [[3, 3], [2, 2], [3, 2], [2, 3]]
  team_size_probs: [0.7, 0.1, 0.1, 0.1]
  # obstacles by coverage fraction (curriculum raises the upper bound 8% -> 22%, see train)
  coverage_min: 0.17                 # denser cover: sight now reaches the far wall
  coverage_max: 0.22                 # ceiling under a 4 m minimum gap, see DESIGN.md
  crate_fraction: 0.15               # share of low crates (block movement only); 0.0 = every obstacle blocks sight
  obstacle_size_min: 4.9             # larger blocks pack better against the 4 m gap and cut long sightlines
  obstacle_size_max: 13.5
  obstacle_min_gap: 4.0
  spawn_clearance: 3.0
  max_obstacles: 72
  spawn_mode: corners                # corners (opposite diagonal corners, ~49 m apart) | lanes
  corner_margin: 7.3
  spawn_distance: 36.7               # lanes mode only
  spawn_lateral_jitter: 4.0
  spawn_zone_radius: 4.0
  # body & motion
  collision_radius: 1.0
  speed_forward: 4.0
  speed_strafe: 2.0
  speed_backward: 1.5
  max_turn_rate_deg: 120.0
  turn_accel_deg: 600.0
  # sensing
  vision_fov_deg: 60.0
  vision_range: 84.0                 # >= arena diagonal (83.1 m): the cone is limited by walls, not by range
  num_rays: 96                       # 0.63 deg spacing: ~2 rays across a 2 m body at 84 m
  map_rays: 64
  # weapon
  hp: 100
  damage: 34
  weapon_range: 84.0                 # hitscan range; lower it below vision_range for "see far, shoot near"
  cooldown: 0.4
  magazine: 12
  reload_time: 2.0
  spread_rest_deg: 0.5
  spread_max_deg: 2.0
  friendly_fire: true
  timeout_hp_tiebreak: true          # corner spawns make mutual avoidance easy; see DESIGN.md
  # team information
  comms: full                        # full | contacts_only | none
  track_staleness_cap: 10.0
  track_confidence_tau: 3.0
  include_prev_action: true
  num_roles: 3
  reward:
    win: 1.0
    loss: -1.0
    draw: 0.0                        # the timeout penalty below is what punishes an undecided fight
    damage_dealt: 0.01
    damage_taken: -0.005
    friendly_damage: -0.1            # per hp point (-3.4 per hit); -1.0 drove squads into a blob, see DESIGN.md
    timeout: -0.5                    # to BOTH teams when the clock runs out, on top of the outcome
    kill: 0.5
    kill_split: false
    death: -0.5
    step: -0.0005

model:
  encoder: entity                    # entity (per-type MLP -> transformer) | conv_mlp (baseline)
  d_model: 128
  transformer_layers: 2
  transformer_heads: 4
  memory: gru                        # gru | framestack
  frame_stack: 4
  hidden: 256
  action_mode: hybrid                # hybrid | discrete
  policy: shared                     # shared | per_slot
  init_log_std: -1.0

roles:
  enabled: true
  rewards:                           # role-specific and team-work incentives (env.role_rewards)
    enabled: true
    assault_close_damage: 0.005      # per hp dealt from <= assault_close_range
    assault_close_range: 12.0
    flank_damage: 0.01               # per hp dealt from the victim's rear half
    flank_angle_deg: 90.0
    overwatch_spot: 0.002            # per step per enemy only this agent sees, from >= overwatch_min_range
    overwatch_min_range: 15.0
    overwatch_assist_damage: 0.005   # per hp teammates deal to an enemy this agent watches
    crossfire_bonus: 0.1             # to both shooters of a crossfire hit, any role

diversity:
  enabled: true
  beta: 0.05

hierarchical:
  enabled: false
  plan_tokens: 4
  interval: 20
  loss_coef: 1.0

league:
  p_latest: 0.7
  win_floor: 0.1
  elo_k: 16.0
  snapshot_every: 20
  max_snapshots: 20
  scripted: [spinner, charger, holder]
  scripted_only: false

train:
  num_envs: 128
  rollout_len: 256
  chunk_len: 32
  minibatches: 4
  epochs: 4
  lr: 3.0e-4
  lr_anneal: true
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  entropy_coef: 0.01
  entropy_coef_final: 0.001
  value_coef: 0.5
  aux_coef: 0.1                      # enemy-position auxiliary loss
  mirror_aug: 0.5                    # probability of mirroring a sequence (actor only)
  max_grad_norm: 0.5
  normalize_returns: true
  coverage_curriculum: {start: 0.08, frac: 0.33}
  spawn_curriculum: {start: 0.45, frac: 0.33}   # corner spawns ramp out from mid-arena
  total_updates: 3000
  log_every: 1
  checkpoint_every: 20
  video_every: 50
